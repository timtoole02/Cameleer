# Pre-pivot multi-agent chat gateway. NOT part of Cameleer v0.1 and NOT a
# member of the root workspace (see ../../Cargo.toml `exclude`). Kept for
# reference only; not built, tested, or shipped. See README.md.
[package]
name = "cameleer-legacy-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
rusqlite = { version = "0.31", features = ["bundled"] }
crossterm = "0.27"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
ratatui = "0.26"
