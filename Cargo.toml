# Virtual workspace for Cameleer v0.1. The canonical product is the Tauri app in
# control-center/ plus the vendored camelid inference engine. The pre-pivot
# gateway crate lives under tools/legacy-gateway/ and is intentionally NOT a
# member (and is excluded) so it can never silently rejoin the build.
[workspace]
resolver = "2"
members = [
    "camelid",
    "control-center/src-tauri",
]
exclude = [
    "tools/legacy-gateway",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
